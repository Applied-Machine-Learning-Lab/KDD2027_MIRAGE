[project]
name = "mirage-rec"
version = "0.1.0"
description = "MIRAGE: Manifold-Informed Rectified Flow for accelerated generative sequential recommendation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0,<2.0",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "torch==2.6.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
